name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build, test, and publish
        shell: pwsh
        run: .\build-release.ps1 -OutputDirectory .\publish

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path .\publish\* -DestinationPath ".\CodexWeeklyQuotaMonitor-${{ github.ref_name }}-win-x64.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ".\CodexWeeklyQuotaMonitor-${{ github.ref_name }}-win-x64.zip" --generate-notes --title "${{ github.ref_name }}"
